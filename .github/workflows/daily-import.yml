name: Daily Fantrax import

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: Europe/Helsinki
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview season routing without downloads or database access
        type: boolean
        default: false
      refresh_finalized:
        description: Reimport completed phases of CURRENT_SEASON for corrections
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fantrax-production-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    env:
      TZ: Europe/Helsinki
      USE_REMOTE_DB: "true"
      USE_R2_STORAGE: "false"
      USE_R2_SNAPSHOTS: "true"
      RAW_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium headless shell
        if: ${{ !inputs.dry_run }}
        run: npx playwright install --with-deps chromium --only-shell
      - name: Import current season
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_SNAPSHOT_BUCKET_NAME: ${{ vars.R2_SNAPSHOT_BUCKET_NAME }}
          R2_SNAPSHOT_PREFIX: ${{ vars.R2_SNAPSHOT_PREFIX || 'snapshots' }}
          FANTRAX_AUTH_STATE: ${{ secrets.FANTRAX_AUTH_STATE }}
          DRY_RUN: ${{ inputs.dry_run }}
          REFRESH_FINALIZED: ${{ inputs.refresh_finalized }}
        run: |
          args=(--require-remote)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$REFRESH_FINALIZED" == "true" ]]; then args+=(--refresh-finalized); fi
          npm run import:daily -- "${args[@]}"
      - name: Remove session files
        if: ${{ always() }}
        run: rm -f src/playwright/.fantrax/fantrax-auth.json src/playwright/.fantrax/fantrax-auth-secret.txt
