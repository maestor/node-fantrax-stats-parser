openapi: "3.0.3"

info:
  title: FFHL Stats API
  version: "1.0.0"
  description: |
    Fantasy hockey league stats API. All data endpoints require an API key
    passed as the `x-api-key` request header.

servers:
  - url: https://ffhl-stats-api.vercel.app
    description: Production
  - url: http://localhost:3000
    description: Local development

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key

  parameters:
    reportType:
      name: reportType
      in: path
      required: true
      description: |
        Report dataset. `regular` and `playoffs` return the corresponding
        dataset. `both` merges regular + playoffs stats then calculates scores.
      schema:
        type: string
        enum: [regular, playoffs, both]

    season:
      name: season
      in: path
      required: true
      description: Starting year of the season in YYYY format (e.g. `2023` for 2023-2024).
      schema:
        type: integer
        example: 2023

    teamId:
      name: teamId
      in: query
      description: Team identifier. Defaults to `1` (repo maintainer's team). IDs are defined in `constants.ts`.
      schema:
        type: string
        example: "1"

    startFrom:
      name: startFrom
      in: query
      description: |
        Filter results to start from this season (inclusive). Starting year in YYYY format.
        Works with `/seasons`, `/players/combined/*`, and `/goalies/combined/*`.
      schema:
        type: integer
        example: 2020

    skip:
      name: skip
      in: query
      description: Number of rows to skip from the start of the sorted highlight list. Defaults to `0`.
      schema:
        type: integer
        minimum: 0
        example: 0

    take:
      name: take
      in: query
      description: Number of rows to return from the sorted highlight list. Defaults to `10`. Use `all` to return every remaining row; the response reports the resolved numeric take.
      schema:
        oneOf:
          - type: integer
            minimum: 0
            maximum: 9007199254740991
            example: 10
          - type: string
            enum: [all]

    careerId:
      name: id
      in: path
      required: true
      description: Fantrax player or goalie identifier.
      schema:
        type: string
        example: "p001"

  schemas:
    Team:
      type: object
      required: [id, name, presentName, teamAbbr]
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: colorado
        presentName:
          type: string
          example: Colorado Avalanche
        teamAbbr:
          type: string
          example: COL
        nameAliases:
          type: array
          items:
            type: string
        firstSeason:
          type: integer
          description: First season year (YYYY) for expansion/relocated teams.
          example: 2017

    DraftTeamRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: "12"
        name:
          type: string
          example: Anaheim Ducks

    DraftCareerProfile:
      type: object
      nullable: true
      description: Career identity for linked players and goalies, including known identities without statistical rows. Null for unmatched picks or identities without a known position.
      required: [id, type]
      properties:
        id:
          type: string
          example: 00qs7
        type:
          type: string
          enum: [player, goalie]

    DraftPick:
      type: object
      required:
        [
          round,
          pickNumber,
          draftedPlayer,
          playedInLeague,
          playedForDraftingTeam,
          originalOwner,
        ]
      properties:
        round:
          type: integer
          example: 1
        pickNumber:
          type: integer
          example: 1
        careerProfile:
          $ref: "#/components/schemas/DraftCareerProfile"
        draftedPlayer:
          type: string
          nullable: true
          example: Connor McDavid
        playedInLeague:
          type: boolean
          description: True when the linked Fantrax entity has at least one games-played row in `players` or `goalies` for any fantasy team.
          example: true
        playedForDraftingTeam:
          type: boolean
          description: True when the linked Fantrax entity has at least one games-played row for the same fantasy team that drafted them.
          example: false
        originalOwner:
          $ref: "#/components/schemas/DraftTeamRef"

    OpeningDraftPick:
      type: object
      required: [round, pickNumber, draftedPlayer, originalOwner]
      properties:
        round:
          type: integer
          example: 1
        pickNumber:
          type: integer
          example: 1
        careerProfile:
          $ref: "#/components/schemas/DraftCareerProfile"
        draftedPlayer:
          type: string
          example: Sidney Crosby
        originalOwner:
          $ref: "#/components/schemas/DraftTeamRef"

    OpeningDraftTeamGroup:
      type: object
      required: [team, picks]
      properties:
        team:
          $ref: "#/components/schemas/DraftTeamRef"
        picks:
          type: array
          items:
            $ref: "#/components/schemas/OpeningDraftPick"

    ExpansionDraftPick:
      type: object
      required: [selectionNumber, draftedPlayer, position, sourceTeam, careerProfile]
      properties:
        selectionNumber:
          type: integer
          description: Source display order, not a draft ranking.
        draftedPlayer: { type: string }
        position: { type: string, enum: [F, D, G] }
        sourceTeam: { $ref: "#/components/schemas/DraftTeamRef" }
        careerProfile: { $ref: "#/components/schemas/DraftCareerProfile" }

    ExpansionDraftGroup:
      type: object
      required: [season, team, picks]
      properties:
        season:
          type: integer
          description: Expansion team's first season starting year.
        team: { $ref: "#/components/schemas/DraftTeamRef" }
        picks:
          type: array
          description: Forwards, defensemen, then goalies; source order within each position.
          items: { $ref: "#/components/schemas/ExpansionDraftPick" }

    EntryDraftSeasonGroup:
      type: object
      required: [season, picks]
      properties:
        season:
          type: integer
          example: 2025
        picks:
          type: array
          items:
            $ref: "#/components/schemas/DraftPick"

    EntryDraftHighestPickItem:
      type: object
      required: [season, round, draftedPlayer]
      properties:
        season:
          type: integer
          example: 2025
        round:
          type: integer
          example: 1
        careerProfile:
          $ref: "#/components/schemas/DraftCareerProfile"
        draftedPlayer:
          type: string
          example: Connor McDavid

    EntryDraftHighestPick:
      type: object
      required: [pickNumber, items]
      properties:
        pickNumber:
          type: integer
          example: 15
        items:
          type: array
          items:
            $ref: "#/components/schemas/EntryDraftHighestPickItem"

    EntryDraftAmountsSummary:
      type: object
      required:
        [
          total,
          ownPicks,
          tradedPicks,
          playersPerDraftAverage,
          playedInLeague,
          playedInLeaguePercent,
          playedForDraftingTeam,
          playedForDraftingTeamPercent,
        ]
      properties:
        total:
          type: integer
          example: 40
        ownPicks:
          type: integer
          example: 32
        tradedPicks:
          type: integer
          example: 8
        playersPerDraftAverage:
          type: number
          description: Average drafted players per entry draft season rounded to two decimals.
          example: 5.71
        playedInLeague:
          type: integer
          description: Drafted players with at least one games-played row in `players` or `goalies` for any fantasy team.
          example: 28
        playedInLeaguePercent:
          type: number
          description: Fraction of drafted players who appeared in league games for any fantasy team, rounded to three decimals.
          example: 0.7
        playedForDraftingTeam:
          type: integer
          description: Drafted players with at least one games-played row for the same fantasy team that drafted them.
          example: 14
        playedForDraftingTeamPercent:
          type: number
          description: Fraction of drafted players who appeared in league games for the fantasy team that drafted them, rounded to three decimals.
          example: 0.35

    EntryDraftRoundsSummary:
      type: object
      required: [first, second, third, fourth, fifth]
      properties:
        first:
          type: integer
          example: 12
        second:
          type: integer
          example: 8
        third:
          type: integer
          example: 6
        fourth:
          type: integer
          example: 3
        fifth:
          type: integer
          example: 1

    EntryDraftTeamSummary:
      type: object
      required: [highestPick, averageDraftPosition, amounts, rounds]
      properties:
        highestPick:
          allOf:
            - $ref: "#/components/schemas/EntryDraftHighestPick"
          nullable: true
        averageDraftPosition:
          type: number
          nullable: true
          description: Average overall draft position across drafted players only, rounded to two decimals.
          example: 54.23
        amounts:
          $ref: "#/components/schemas/EntryDraftAmountsSummary"
        rounds:
          $ref: "#/components/schemas/EntryDraftRoundsSummary"

    EntryDraftTeamGroup:
      type: object
      required: [team, summary, seasons]
      properties:
        team:
          $ref: "#/components/schemas/DraftTeamRef"
        summary:
          $ref: "#/components/schemas/EntryDraftTeamSummary"
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/EntryDraftSeasonGroup"

    Season:
      type: object
      required: [season, text]
      properties:
        season:
          type: integer
          example: 2023
        text:
          type: string
          example: "2023-2024"

    CountSplit:
      type: object
      required: [owned, played]
      properties:
        owned:
          type: integer
        played:
          type: integer

    CareerSummaryTeam:
      type: object
      required: [teamId, teamName, seasonCount, firstSeason, lastSeason]
      properties:
        teamId:
          type: string
        teamName:
          type: string
        seasonCount:
          $ref: "#/components/schemas/CountSplit"
        firstSeason:
          type: integer
        lastSeason:
          type: integer

    CareerSummary:
      type: object
      required: [firstSeason, lastSeason, seasonCount, teamCount, teams]
      properties:
        firstSeason:
          type: integer
        lastSeason:
          type: integer
        seasonCount:
          $ref: "#/components/schemas/CountSplit"
        teamCount:
          $ref: "#/components/schemas/CountSplit"
        teams:
          type: array
          items:
            $ref: "#/components/schemas/CareerSummaryTeam"

    CareerPlayerStatsLine:
      type: object
      required:
        - games
        - goals
        - assists
        - points
        - plusMinus
        - penalties
        - shots
        - ppp
        - shp
        - hits
        - blocks
      properties:
        games:
          type: number
        goals:
          type: number
        assists:
          type: number
        points:
          type: number
        plusMinus:
          type: number
        penalties:
          type: number
        shots:
          type: number
        ppp:
          type: number
        shp:
          type: number
        hits:
          type: number
        blocks:
          type: number

    CareerGoalieStatsLine:
      type: object
      required:
        - games
        - wins
        - saves
        - shutouts
        - goals
        - assists
        - points
        - penalties
        - ppp
        - shp
      properties:
        games:
          type: number
        wins:
          type: number
        saves:
          type: number
        shutouts:
          type: number
        goals:
          type: number
        assists:
          type: number
        points:
          type: number
        penalties:
          type: number
        ppp:
          type: number
        shp:
          type: number

    CareerPlayerTeamTotals:
      allOf:
        - $ref: "#/components/schemas/CareerPlayerStatsLine"
        - type: object
          required: [teamId, teamName, seasonCount]
          properties:
            teamId:
              type: string
            teamName:
              type: string
            seasonCount:
              $ref: "#/components/schemas/CountSplit"

    CareerGoalieTeamTotals:
      allOf:
        - $ref: "#/components/schemas/CareerGoalieStatsLine"
        - type: object
          required: [teamId, teamName, seasonCount]
          properties:
            teamId:
              type: string
            teamName:
              type: string
            seasonCount:
              $ref: "#/components/schemas/CountSplit"

    CareerPlayerTotals:
      allOf:
        - $ref: "#/components/schemas/CareerPlayerStatsLine"
        - type: object
          required: [seasonCount, teamCount, teams]
          properties:
            seasonCount:
              $ref: "#/components/schemas/CountSplit"
            teamCount:
              $ref: "#/components/schemas/CountSplit"
            teams:
              type: array
              items:
                $ref: "#/components/schemas/CareerPlayerTeamTotals"

    CareerGoalieTotals:
      allOf:
        - $ref: "#/components/schemas/CareerGoalieStatsLine"
        - type: object
          required: [seasonCount, teamCount, teams]
          properties:
            seasonCount:
              $ref: "#/components/schemas/CountSplit"
            teamCount:
              $ref: "#/components/schemas/CountSplit"
            teams:
              type: array
              items:
                $ref: "#/components/schemas/CareerGoalieTeamTotals"

    CareerPlayerSeason:
      allOf:
        - $ref: "#/components/schemas/CareerPlayerStatsLine"
        - type: object
          required: [season, reportType, teamId, teamName, position]
          properties:
            season:
              type: integer
            reportType:
              type: string
              enum: [regular, playoffs]
            teamId:
              type: string
            teamName:
              type: string
            position:
              type: string

    CareerGoalieSeason:
      allOf:
        - $ref: "#/components/schemas/CareerGoalieStatsLine"
        - type: object
          required: [season, reportType, teamId, teamName]
          properties:
            season:
              type: integer
            reportType:
              type: string
              enum: [regular, playoffs]
            teamId:
              type: string
            teamName:
              type: string
            gaa:
              type: string
              description: Goals against average formatted with two decimals. Played zero values are returned as `0.00`; omitted only when source data only contains a non-played zero placeholder.
            savePercent:
              type: string
              description: Save percentage formatted with three decimals. Played zero values are returned as `0.000`; omitted only when source data only contains a non-played zero placeholder.

    HistoryTeam:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    HistoryCoverage:
      type: object
      description: Seasons containing stored records, not a completed-import manifest. Empty imports and missing imports cannot be distinguished; completeness is unknown.
      required: [expansionDraftSeasons, entryDraftSeasons, openingDraftPresent, claimSeasons, tradeSeasons, completeness]
      properties:
        expansionDraftSeasons:
          type: array
          items: { type: integer }
        entryDraftSeasons:
          type: array
          items: { type: integer }
        openingDraftPresent: { type: boolean }
        claimSeasons:
          type: array
          items: { type: integer }
        tradeSeasons:
          type: array
          items: { type: integer }
        completeness: { type: string, enum: [unknown] }

    DraftHistoryEvent:
      type: object
      required: [id, type, season, date, draftType, round, pickNumber, team, originalOwner]
      properties:
        id: { type: string }
        type: { type: string, enum: [draft] }
        season:
          type: integer
          nullable: true
          description: Opening draft records have no stored season.
        date:
          type: string
          nullable: true
          description: No exact draft date is stored; always null.
        draftType: { type: string, enum: [entry, opening] }
        round: { type: integer }
        pickNumber: { type: integer }
        team: { $ref: '#/components/schemas/HistoryTeam' }
        originalOwner: { $ref: '#/components/schemas/HistoryTeam' }

    ExpansionHistoryEvent:
      type: object
      required: [id, type, season, date, fromTeam, team]
      properties:
        id: { type: string }
        type: { type: string, enum: [expansion] }
        season: { type: integer }
        date:
          type: string
          nullable: true
          description: No exact expansion draft date is stored; always null.
        fromTeam: { $ref: '#/components/schemas/HistoryTeam' }
        team: { $ref: '#/components/schemas/HistoryTeam' }

    ClaimHistoryEvent:
      type: object
      required: [id, type, season, date, team]
      properties:
        id: { type: string }
        type: { type: string, enum: [claim, drop] }
        season: { type: integer }
        date: { type: string }
        team: { $ref: '#/components/schemas/HistoryTeam' }

    HistoryMovement:
      type: object
      required: [fromTeam, toTeam]
      properties:
        fromTeam: { $ref: '#/components/schemas/HistoryTeam' }
        toTeam: { $ref: '#/components/schemas/HistoryTeam' }

    TradeHistoryEvent:
      type: object
      required: [id, type, season, date, tradeId, status, movements]
      properties:
        id: { type: string }
        type: { type: string, enum: [trade] }
        season: { type: integer }
        date: { type: string }
        tradeId: { type: string }
        status: { $ref: '#/components/schemas/TradeAssemblyStatus' }
        movements:
          type: array
          items: { $ref: '#/components/schemas/HistoryMovement' }

    CareerHistory:
      type: object
      required: [id, coverage, events]
      properties:
        id: { type: string }
        coverage: { $ref: '#/components/schemas/HistoryCoverage' }
        events:
          type: array
          description: Newest season first, then newest dated event; undated drafts follow dated events within a season, with expansion selections at the bottom of their season. Opening draft records appear last. Equal timestamps use deterministic source identity order, not a claimed temporal order.
          items:
            oneOf:
              - { $ref: '#/components/schemas/DraftHistoryEvent' }
              - { $ref: '#/components/schemas/ExpansionHistoryEvent' }
              - { $ref: '#/components/schemas/ClaimHistoryEvent' }
              - { $ref: '#/components/schemas/TradeHistoryEvent' }

    TradeAssemblyStatus:
      type: string
      enum: [reconstructed, ambiguous, incomplete]
      description: Reconstructed means exactly two opposing source blocks with matching period within one source-file/season/timestamp/participant group. This is an inference, not a provider-confirmed deal ID. Extra blocks or different periods are ambiguous; missing opposing directions are incomplete.

    TradeAsset:
      type: object
      required: [type, name, rawName, entityId, careerType, position, fromTeam, toTeam, draftSeason, draftRound, draftOriginalOwner]
      properties:
        type: { type: string, enum: [player, draft_pick, other] }
        name: { type: string }
        rawName: { type: string }
        entityId: { type: string, nullable: true }
        careerType:
          type: string
          nullable: true
          enum: [player, goalie]
          description: Present for linked career identities, including known players and goalies without statistical rows.
        position: { type: string, nullable: true }
        fromTeam: { $ref: '#/components/schemas/HistoryTeam' }
        toTeam: { $ref: '#/components/schemas/HistoryTeam' }
        draftSeason: { type: integer, nullable: true }
        draftRound: { type: integer, nullable: true }
        draftOriginalOwner:
          allOf:
            - { $ref: '#/components/schemas/HistoryTeam' }
          nullable: true

    TradeSourceBlock:
      type: object
      required: [sourceBlockIndex, sourcePeriod, assets]
      properties:
        sourceBlockIndex: { type: integer }
        sourcePeriod: { type: integer }
        assets:
          type: array
          items: { $ref: '#/components/schemas/TradeAsset' }

    TradeDetail:
      type: object
      required: [id, season, date, status, blocks]
      properties:
        id: { type: string }
        season: { type: integer }
        date: { type: string }
        status: { $ref: '#/components/schemas/TradeAssemblyStatus' }
        blocks:
          type: array
          description: Original directional blocks preserved even when assembly is ambiguous or incomplete.
          items: { $ref: '#/components/schemas/TradeSourceBlock' }

    CareerHistoryProfile:
      type: object
      additionalProperties: false
      description: Identity-only career profile for a known player without any imported statistical rows. History is available separately from /career/history/{id}.
      required: [id, name, position]
      properties:
        id: { type: string }
        name: { type: string }
        position: { type: string, enum: [F, D, G] }

    CareerPlayerProfile:
      oneOf:
        - $ref: '#/components/schemas/CareerPlayer'
        - $ref: '#/components/schemas/CareerHistoryProfile'

    CareerGoalieProfile:
      oneOf:
        - $ref: '#/components/schemas/CareerGoalie'
        - $ref: '#/components/schemas/CareerHistoryProfile'

    CareerPlayer:
      type: object
      required: [id, name, position, summary, totals, seasons]
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: string
        summary:
          $ref: "#/components/schemas/CareerSummary"
        totals:
          type: object
          required: [career, regular, playoffs]
          properties:
            career:
              $ref: "#/components/schemas/CareerPlayerTotals"
            regular:
              $ref: "#/components/schemas/CareerPlayerTotals"
            playoffs:
              $ref: "#/components/schemas/CareerPlayerTotals"
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/CareerPlayerSeason"

    CareerPlayerListItem:
      type: object
      required:
        - id
        - name
        - position
        - firstSeason
        - lastSeason
        - seasonsOwned
        - seasonsPlayedRegular
        - seasonsPlayedPlayoffs
        - teamsOwned
        - teamsPlayedRegular
        - teamsPlayedPlayoffs
        - regularGames
        - playoffGames
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: string
        firstSeason:
          type: integer
          nullable: true
          description: Statistical season; null when no statistical rows exist.
        lastSeason:
          type: integer
          nullable: true
          description: Statistical season; null when no statistical rows exist.
        seasonsOwned:
          type: integer
        seasonsPlayedRegular:
          type: integer
        seasonsPlayedPlayoffs:
          type: integer
        teamsOwned:
          type: integer
        teamsPlayedRegular:
          type: integer
        teamsPlayedPlayoffs:
          type: integer
        regularGames:
          type: integer
        playoffGames:
          type: integer

    CareerGoalieListItem:
      type: object
      required:
        - id
        - name
        - firstSeason
        - lastSeason
        - seasonsOwned
        - seasonsPlayedRegular
        - seasonsPlayedPlayoffs
        - teamsOwned
        - teamsPlayedRegular
        - teamsPlayedPlayoffs
        - regularGames
        - playoffGames
      properties:
        id:
          type: string
        name:
          type: string
        firstSeason:
          type: integer
          nullable: true
          description: Statistical season; null when no statistical rows exist.
        lastSeason:
          type: integer
          nullable: true
          description: Statistical season; null when no statistical rows exist.
        seasonsOwned:
          type: integer
        seasonsPlayedRegular:
          type: integer
        seasonsPlayedPlayoffs:
          type: integer
        teamsOwned:
          type: integer
        teamsPlayedRegular:
          type: integer
        teamsPlayedPlayoffs:
          type: integer
        regularGames:
          type: integer
        playoffGames:
          type: integer

    CareerHighlightType:
      type: string
      enum:
        - most-teams-played
        - most-teams-owned
        - same-team-seasons-played
        - same-team-seasons-owned
        - most-stanley-cups
        - reunion-king
        - stash-king
        - regular-grinder-without-playoffs
        - most-trades
        - most-claims
        - most-drops

    CareerHighlightTeam:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    CareerTeamCountHighlightItem:
      type: object
      required: [id, name, position, teamCount, teams]
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: string
        teamCount:
          type: integer
        teams:
          type: array
          items:
            $ref: "#/components/schemas/CareerHighlightTeam"

    CareerSameTeamHighlightItem:
      type: object
      required: [id, name, position, seasonCount, team]
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: string
        seasonCount:
          type: integer
        team:
          $ref: "#/components/schemas/CareerHighlightTeam"

    CareerStanleyCupHighlightCup:
      type: object
      required: [season, team]
      properties:
        season:
          type: integer
        team:
          $ref: "#/components/schemas/CareerHighlightTeam"

    CareerStanleyCupHighlightItem:
      type: object
      required: [id, name, position, cupCount, cups]
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: string
        cupCount:
          type: integer
        cups:
          type: array
          items:
            $ref: "#/components/schemas/CareerStanleyCupHighlightCup"

    CareerReunionHighlightItem:
      type: object
      required: [id, name, position, reunionCount, team, reunions]
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: string
        reunionCount:
          type: integer
        team:
          $ref: "#/components/schemas/CareerHighlightTeam"
        reunions:
          type: array
          items:
            $ref: "#/components/schemas/CareerReunionHighlightReunion"

    CareerReunionHighlightReunion:
      type: object
      required: [date, type]
      properties:
        date:
          type: string
        type:
          type: string
