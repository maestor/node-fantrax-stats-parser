        - shutouts

    FinalsLeaderboardCategory:
      type: object
      required:
        - statKey
        - awayValue
        - homeValue
        - winnerTeamId
      properties:
        statKey:
          $ref: "#/components/schemas/FinalsStatKey"
        awayValue:
          type: number
          nullable: true
        homeValue:
          type: number
          nullable: true
        winnerTeamId:
          type: string
          nullable: true

    FinalsLeaderboardRates:
      type: object
      required:
        - winRate
        - deservedToWinRate
      properties:
        winRate:
          type: number
          description: "The actual finals scoreboard share for the champion as a fraction between 0 and 1, rounded to three decimals. Example: `0.567` means `56.7%`."
        deservedToWinRate:
          type: number
          description: "A weighted, games-adjusted finals strength model returned as a fraction between 0 and 1, rounded to three decimals."

    FinalsLeaderboardFactors:
      type: object
      required:
        - awayTeam
        - homeTeam
      properties:
        awayTeam:
          $ref: "#/components/schemas/FinalsLeaderboardFactorSet"
        homeTeam:
          $ref: "#/components/schemas/FinalsLeaderboardFactorSet"

    FinalsLeaderboardFactorSet:
      type: object
      required:
        - offence
        - physical
        - goalies
      properties:
        offence:
          type: number
          description: "Share of combined offensive category production (`goals`, `assists`, `shots`, `ppp`, `shp`) as a fraction between 0 and 1, rounded to three decimals."
        physical:
          type: number
          description: "Share of combined physical category production (`hits`, `blocks`, `penalties`) as a fraction between 0 and 1, rounded to three decimals."
        goalies:
          type: number
          description: "Hybrid goalie matchup share returned as a fraction between 0 and 1, rounded to three decimals. Blends count-stat volume (`wins`, `saves`, `shutouts`) with goalie-rate efficiency (`gaa`, `savePercent`)."

security:
  - apiKey: []

paths:
  /:
    get:
      summary: Service info
      description: Returns a plain-text message confirming the service is running.
      security: []
      responses:
        "200":
          description: Service is running.
          content:
            text/plain:
              schema:
                type: string
                example: Hello there! The FFHL Stats Service is running.

  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status, uptimeSeconds, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  uptimeSeconds:
                    type: number
                  timestamp:
                    type: string
                    format: date-time

  /healthcheck:
    get:
      summary: Health check (alias for /health)
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status, uptimeSeconds, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  uptimeSeconds:
                    type: number
                  timestamp:
                    type: string
                    format: date-time

  /openapi.json:
    get:
      summary: OpenAPI spec (JSON)
      security: []
      responses:
        "200":
          description: OpenAPI 3.0.3 spec as JSON.
          content:
            application/json:
              schema:
                type: object

  /api-docs:
    get:
      summary: Interactive API documentation (Swagger UI)
      security: []
      responses:
        "200":
          description: Swagger UI HTML page.
          content:
            text/html:
              schema:
                type: string

  /last-modified:
    get:
      summary: Last data import timestamp
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Timestamp of the most recent data import.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastModified:
                    type: string
                    format: date-time
                    nullable: true
                    description: ISO 8601 timestamp, or null if no import has run.
        "401":
          description: Missing or invalid API key.

  /teams:
    get:
      summary: Available teams
      responses:
        "200":
          description: List of all teams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          description: Missing or invalid API key.

  /draft/entry:
    get:
      summary: Entry draft history grouped by drafted team and season
      description: |
        Returns the imported FFHL entry draft history from `entry_draft_picks`.
        Teams are grouped alphabetically by current fantasy-team name.
        Each team's `seasons` array is sorted newest-first, and picks within one season
        are sorted by draft order.
        Team roots also include a `summary` object with highest-pick, average-position,
        pick-count aggregates, played counts, played percentages, and a fixed round
        breakdown calculated from the grouped data.
        Each pick also includes `playedInLeague` and `playedForDraftingTeam` flags based
        on whether the linked Fantrax entity has games-played rows in `players` or
        `goalies`.
        Picks with `draftedPlayer: null` stay in the season pick lists but are excluded from
        all summary calculations.
      responses:
        "200":
          description: Entry draft picks grouped by drafted fantasy team and season.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntryDraftTeamGroup"
        "401":
          description: Missing or invalid API key.

  /draft/expansion:
    get:
      summary: Expansion draft selections
      description: Returns imported expansion drafts newest season first. Career links support known player and goalie identities with or without statistical rows.
      responses:
        "200":
          description: Expansion drafts with source teams and linked careers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExpansionDraftGroup" }
        "401":
          description: Missing or invalid API key.

  /draft/original:
    get:
      summary: Opening draft history grouped by drafted team
      description: |
        Returns the imported FFHL opening draft history from `opening_draft_picks`.
        Teams are grouped alphabetically by current fantasy-team name and each group's
        picks are sorted by draft order.
      responses:
        "200":
          description: Opening draft picks grouped by drafted fantasy team.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpeningDraftTeamGroup"
        "401":
          description: Missing or invalid API key.

  /seasons:
    get:
      summary: Available seasons (defaults to regular)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/startFrom"
      responses:
        "200":
          description: List of seasons that have data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Season"
        "400":
          description: Invalid report type.
        "401":
          description: Missing or invalid API key.

  /seasons/{reportType}:
    get:
      summary: Available seasons for a report type
      parameters:
        - $ref: "#/components/parameters/reportType"
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/startFrom"
      responses:
        "200":
          description: List of seasons that have data for the given report type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Season"
        "400":
          description: Invalid report type.
        "401":
          description: Missing or invalid API key.

  /players/season/{reportType}:
    get:
      summary: Player stats for the latest available season
      parameters:
        - $ref: "#/components/parameters/reportType"
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Player stats array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
        "400":
          description: Invalid report type or season not available.
        "401":
          description: Missing or invalid API key.

  /players/season/{reportType}/{season}:
    get:
      summary: Player stats for a specific season
      parameters:
        - $ref: "#/components/parameters/reportType"
        - $ref: "#/components/parameters/season"
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Player stats array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
        "400":
          description: Invalid report type or season not available.
        "401":
          description: Missing or invalid API key.

  /players/combined/{reportType}:
    get:
      summary: Player stats combined across all seasons
      description: |
        Returns each player's stats aggregated across all seasons (from 2012-2013 onwards).
        Each entry includes a `seasons` array with per-season stats and scores.
      parameters:
        - $ref: "#/components/parameters/reportType"
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/startFrom"
      responses:
        "200":
          description: Combined player stats array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CombinedPlayer"
        "400":
          description: Invalid report type.
        "401":
          description: Missing or invalid API key.

  /goalies/season/{reportType}:
    get:
      summary: Goalie stats for the latest available season
      parameters:
        - $ref: "#/components/parameters/reportType"
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Goalie stats array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goalie"
        "400":
          description: Invalid report type or season not available.
        "401":
          description: Missing or invalid API key.

  /goalies/season/{reportType}/{season}:
    get:
      summary: Goalie stats for a specific season
      parameters:
        - $ref: "#/components/parameters/reportType"
        - $ref: "#/components/parameters/season"
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Goalie stats array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goalie"
        "400":
          description: Invalid report type or season not available.
        "401":
          description: Missing or invalid API key.

  /goalies/combined/{reportType}:
    get:
      summary: Goalie stats combined across all seasons
      description: |
        Returns each goalie's stats aggregated across all seasons (from 2012-2013 onwards).
        `gaa` and `savePercent` are omitted when `reportType=both` (cannot be combined reliably).
        Each entry includes a `seasons` array with per-season stats.
      parameters:
        - $ref: "#/components/parameters/reportType"
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/startFrom"
      responses:
        "200":
          description: Combined goalie stats array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CombinedGoalie"
        "400":
          description: Invalid report type.
        "401":
          description: Missing or invalid API key.

  /career/history/{id}:
    get:
      summary: Recorded draft and transaction history for a career identity
      description: |
        Reads linked records only, across all teams. Supports stats-backed careers and known Fantrax identities without
        statistical rows. Coverage describes stored-record seasons with
        unknown completeness. Does not infer current ownership or exact roster tenures.
        Omits a claim when it is the first transaction after a draft and goes to the drafting
        team, regardless of season. Claims tied with another transaction at the same timestamp
        remain visible because their order is unknown. Stored transactions and counts are unchanged.
      parameters:
        - $ref: '#/components/parameters/careerId'
      responses:
        "200":
          description: Career history and source coverage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareerHistory' }
        "401": { description: Missing or invalid API key. }
        "404": { description: Unknown career identity. }

  /transactions/trades/{id}:
    get:
      summary: Inspect a reconstructed trade or ambiguous source group
      description: |
        Returns all directed assets in the source group, including unresolved names and picks.
        Use status before describing the group as one package. IDs are opaque source-derived
        identifiers returned by career history; their encoding is not a client contract.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Opaque trade identifier returned by career history.
      responses:
        "200":
          description: Trade source blocks and assembly status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeDetail' }
        "401": { description: Missing or invalid API key. }
        "404": { description: Invalid or unknown trade identifier. }

  /career/player/{id}:
    get:
      summary: Career profile for one player
      description: |
        Returns all imported career records for a single Fantrax player ID across all fantasy teams.
        Known identities without statistical rows return only id, name and position.
        Zero-game rows are included and count toward `owned` totals but not `played` totals.
      parameters:
        - $ref: "#/components/parameters/careerId"
      responses:
        "200":
          description: Career profile document for one player.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPlayerProfile"
        "401":
          description: Missing or invalid API key.
        "404":
          description: Player not found.

  /career/players:
    get:
      summary: Career player list
      description: |
        Returns one summary row per player across all fantasy teams.
        Zero-game rows count toward owned seasons and teams, but not played counts.
        Identities without any statistical rows have zero counters and null first/last statistical seasons.
      responses:
        "200":
          description: Career player list entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerPlayerListItem"
        "401":
          description: Missing or invalid API key.

  /career/goalie/{id}:
    get:
      summary: Career profile for one goalie
      description: |
        Returns all imported career records for a single Fantrax goalie ID across all fantasy teams.
        Known identities without statistical rows return only id, name and position.
        Zero-game rows are included and count toward `owned` totals but not `played` totals.
      parameters:
        - $ref: "#/components/parameters/careerId"
      responses:
        "200":
          description: Career profile document for one goalie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerGoalieProfile"
        "401":
          description: Missing or invalid API key.
        "404":
          description: Goalie not found.

  /career/goalies:
    get:
      summary: Career goalie list
      description: |
        Returns one summary row per goalie across all fantasy teams.
        Zero-game rows count toward owned seasons and teams, but not played counts.
        Identities without any statistical rows have zero counters and null first/last statistical seasons.
      responses:
        "200":
          description: Career goalie list entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerGoalieListItem"
        "401":
          description: Missing or invalid API key.

  /career/highlights/{type}:
    get:
      summary: Career highlights leaderboard
      description: |
        Returns a paged mixed skater + goalie career highlights leaderboard.
        Each page includes `minAllowed`, the active backend threshold for that highlight type.
        `most-teams-played` and `most-teams-owned` return team-count rows.
        `same-team-seasons-played` and `same-team-seasons-owned` return one row per top team, so the same person can appear multiple times on tied same-team results.
        `most-stanley-cups` returns one row per player/goalie with cup seasons and fantasy teams.
        `reunion-king` returns one row per top reunion team, so the same person can appear multiple
        times on tied reunion results, and includes reunion transactions with ISO dates plus whether
        the player returned by claim or trade.
        `stash-king` returns the top same-team zero-game season counts, similar to
        `same-team-seasons-owned` but counting only team seasons where both regular and playoff
        games stayed at zero.
        `regular-grinder-without-playoffs` returns total regular-season games plus the played fantasy teams
        for players/goalies who never recorded a playoff appearance.
        `most-trades`, `most-claims`, and `most-drops` return total matched player/goalie transaction counts
        plus per-team breakdowns sorted by descending transaction count. Trade counts use the fantasy team that
        traded the player away.
        Minimum cutoffs are 4 teams for `most-teams-played`, 5 teams for `most-teams-owned`,
        8 same-team seasons for `same-team-seasons-played`, 10 same-team seasons for
        `same-team-seasons-owned`, 2 cups for `most-stanley-cups`, 2 reunions for
        `reunion-king`, 10 stash counts for `stash-king`, 60 games for
        `regular-grinder-without-playoffs`, 4 trades for `most-trades`, and 3 claims/drops for
        `most-claims` / `most-drops`.
      parameters:
        - name: type
          in: path
          required: true
          description: Career highlight leaderboard type.
          schema:
            $ref: "#/components/schemas/CareerHighlightType"
        - $ref: "#/components/parameters/skip"
        - $ref: "#/components/parameters/take"
      responses:
        "200":
          description: Paged career highlight results.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CareerTeamCountHighlightPage"
                  - $ref: "#/components/schemas/CareerSameTeamHighlightPage"
                  - $ref: "#/components/schemas/CareerStanleyCupHighlightPage"
                  - $ref: "#/components/schemas/CareerReunionHighlightPage"
                  - $ref: "#/components/schemas/CareerStashHighlightPage"
                  - $ref: "#/components/schemas/CareerRegularGrinderHighlightPage"
                  - $ref: "#/components/schemas/CareerTransactionHighlightPage"
        "400":
          description: Invalid highlight type or paging params.
        "401":
          description: Missing or invalid API key.

  /leaderboard/playoffs:
    get:
      summary: All-time playoff leaderboard
      description: |
        Returns each team's all-time playoff record sorted by best result.
        Includes `tieRank: true` when the entry's record matches the previous entry.
      responses:
        "200":
          description: Playoff leaderboard entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayoffLeaderboardEntry"
        "401":
          description: Missing or invalid API key.

  /leaderboard/regular:
    get:
      summary: All-time regular season leaderboard
      description: |
        Returns each team's all-time regular season record aggregated across all seasons,
        sorted by total points then total wins.
        Includes `tieRank: true` when the entry's record matches the previous entry.
      responses:
        "200":
          description: Regular season leaderboard entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegularLeaderboardEntry"
        "401":
          description: Missing or invalid API key.

  /leaderboard/transactions:
    get:
      summary: All-time transaction leaderboard
      description: |
        Returns each team's total claim, drop, and trade counts plus distinct skater/goalie
        Fantrax entity totals with a per-season breakdown.
        Trade totals count distinct team participations by `season + occurred_at`.
        Player and goalie totals count unique Fantrax entity IDs across roster history.
      responses:
        "200":
          description: Transaction leaderboard entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionLeaderboardEntry"
        "401":
          description: Missing or invalid API key.

  /leaderboard/categories:
    get:
      summary: Regular-season team category dashboard
      description: |
        Returns regular-season category totals and credited-game rates, ranks among teams with
        reported production, eligible-team medians, next-better gaps, immediate prior-season
        comparisons, and credited player contributions. This endpoint never includes playoff
        rows. Missing team reports are reported through coverage metadata and are not treated
        as zero totals. Goalie GAA and save percentage are omitted because stored player ratios
        cannot be combined into exact team rates.
      parameters:
        - name: season
          in: query
          required: false
          description: Starting year for an imported regular season. Omission selects the previous season.
          schema:
            type: string
            pattern: '^\d{4}$'
          example: "2025"
      responses:
        "200":
          description: Regular-season team category dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDashboardResponse"
        "400":
          description: Malformed or unavailable season.
        "401":
          description: Missing or invalid API key.

  /leaderboard/finals:
    get:
      summary: Finals matchup leaderboard
      description: |
        Returns one finals matchup summary per imported season, including away/home team details,
        category results, a `rates` object with both the actual win share and a modeled
        deserved-to-win percentage, plus `factors` that split matchup influence into offence,
        physical play, and goaltending.
      responses:
        "200":
          description: Finals matchup summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinalsLeaderboardEntry"
        "401":
          description: Missing or invalid API key.
